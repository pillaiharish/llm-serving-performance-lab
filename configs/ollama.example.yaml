version: 1

endpoint:
  base_url: "https://ollama.com/v1"
  api_key_env: "OLLAMA_API_KEY"
  model: "<model-name>"

request:
  prompt: "Explain KV cache briefly."
  max_output_tokens: 64
  temperature: 0

runtime:
  timeout: "120s"
  drain_timeout: "120s"

capture:
  output_dir: "runs"

benchmark:
  mode: closed_loop
  concurrency: 1
  requests: 1
  warmup_requests: 0
  token_timing:
    mode: disabled
  slo:
    ttft: null
    tpot: null
    e2e: null
  safety:
    max_concurrency: 256
    max_requests: 10000
    max_request_rate: 10000
    max_in_flight: 256
    max_input_tokens: 131072
    max_output_tokens: 32768
