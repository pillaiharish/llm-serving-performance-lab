version: 1

endpoint:
  base_url: "http://127.0.0.1:18000/v1"
  api_key_env: "VLLM_API_KEY"
  model: "<served-model-name>"

workload:
  mode: token_length
  input_tokens: 128
  tokenizer:
    adapter: vllm
    url: "http://127.0.0.1:18000/tokenize"

request:
  max_output_tokens: 32
  temperature: 0

runtime:
  timeout: "120s"
  drain_timeout: "120s"

capture:
  output_dir: "runs/token-length"

benchmark:
  mode: closed_loop
  concurrency: 2
  requests: 8
  warmup_requests: 0
  safety:
    max_concurrency: 256
    max_requests: 10000
    max_request_rate: 10000
    max_in_flight: 256
    max_input_tokens: 131072
    max_output_tokens: 32768
