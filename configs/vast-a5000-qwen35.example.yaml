version: 1

endpoint:
  base_url: "http://127.0.0.1:18000/v1"
  api_key_env: "VAST_VLLM_TOKEN"
  model: "Qwen/Qwen3.5-4B"

request:
  prompt: "Explain KV cache in two short sentences."
  max_output_tokens: 64
  temperature: 0

runtime:
  timeout: "120s"
  drain_timeout: "120s"

capture:
  output_dir: "runs/vast-a5000-smoke"

benchmark:
  mode: closed_loop
  concurrency: 1
  requests: 1
  warmup_requests: 0
  safety:
    max_concurrency: 256
    max_requests: 10000
    max_request_rate: 10000
    max_in_flight: 256
    max_input_tokens: 131072
    max_output_tokens: 32768
